name: Build experimental ISO

on:
  push:
    branches: [dev]
    paths:
      - "kickstart/**"
      - "scripts/build-preview-iso.sh"
      - "scripts/write-provenance.py"
      - "tests/test_iso_builder_contract.py"
      - "tests/test_build_provenance.py"
      - ".github/workflows/build-preview-iso.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-preview-iso-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-preview:
    # Keep the privileged builder limited to the canonical integration branch, including workflow_dispatch.
    if: github.ref == 'refs/heads/dev'
    # No pull_request trigger and no secrets: the image builder needs elevated
    # mount privileges. This runs only on an ephemeral GitHub-hosted runner.
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out system repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: deku-system
          persist-credentials: false
      - name: Check out profile repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Deku-Foundation/deku-profiles
          ref: 1aba28cd535c6ba90b7168660ff2188a3c5e24a2
          path: deku-profiles
          persist-credentials: false
      - name: Check out pinned Rust profile validator
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Deku-Foundation/deku-build
          ref: 20bd35be9db6b99cf26bbfb6482914ec333a8ac5
          path: deku-build
          persist-credentials: false
      - name: Install Rust toolchain for profile preflight
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # pinned action revision
        with:
          toolchain: 1.99.1
      - name: Record immutable source revisions
        run: |
          echo "DEKU_VALIDATOR_SHA=$(git -C deku-build rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Validate profile and Kickstart in Rust before privileged build
        working-directory: deku-build
        run: |
          cargo run --locked -- validate-profile \
            "$GITHUB_WORKSPACE/deku-profiles/profiles/minimal-x86_64/profile.json" \
            "$GITHUB_WORKSPACE/deku-system/kickstart/deku-minimal-live.ks"
      - name: Build in disposable Fedora 44 container
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          PROFILE_SHA="$(git -C deku-profiles rev-parse HEAD)"
          echo "DEKU_PROFILE_SHA=$PROFILE_SHA" >> "$GITHUB_ENV"
          docker run --rm --privileged \
            -e GITHUB_SHA -e GITHUB_RUN_ID \
            -e PROFILE_SHA="$PROFILE_SHA" \
            -e BUILDER_IMAGE_DIGEST="fedora:44@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace/deku-system \
            fedora:44@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80 bash -euxo pipefail -c '
              dnf -y install lorax lorax-lmc-novirt grub2-pc-modules policycoreutils
              bash ./scripts/build-preview-iso.sh
            '
      - name: Check out boot acceptance harness
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Deku-Foundation/deku-tests
          ref: 61d0758b006571f1fa944fdf6f50bb3584267232
          path: deku-tests
          persist-credentials: false
      - name: Record immutable boot harness revision
        run: |
          echo "DEKU_TEST_HARNESS_SHA=$(git -C deku-tests rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Install QEMU and UEFI firmware
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf
          if [[ -f /usr/share/OVMF/OVMF_CODE_4M.fd && -f /usr/share/OVMF/OVMF_VARS_4M.fd ]]; then
            echo "OVMF_CODE=/usr/share/OVMF/OVMF_CODE_4M.fd" >> "$GITHUB_ENV"
            echo "FIRMWARE=/usr/share/OVMF/OVMF_CODE_4M.fd" >> "$GITHUB_ENV"
            echo "OVMF_VARS=/usr/share/OVMF/OVMF_VARS_4M.fd" >> "$GITHUB_ENV"
          elif [[ -f /usr/share/OVMF/OVMF_CODE.fd && -f /usr/share/OVMF/OVMF_VARS.fd ]]; then
            echo "OVMF_CODE=/usr/share/OVMF/OVMF_CODE.fd" >> "$GITHUB_ENV"
            echo "FIRMWARE=/usr/share/OVMF/OVMF_CODE.fd" >> "$GITHUB_ENV"
            echo "OVMF_VARS=/usr/share/OVMF/OVMF_VARS.fd" >> "$GITHUB_ENV"
          else
            echo "Matching OVMF code and variable-store files were not found." >&2
            exit 1
          fi
      - name: Prepare generated artifact permissions for host-side checks
        if: always()
        run: |
          # The privileged container creates root-owned output files. Restore the
          # runner user ownership before the unprivileged QEMU harness writes evidence.
          if [ -d deku-system/artifacts ]; then
            sudo chown -R "$(id -u):$(id -g)" deku-system/artifacts
          fi
      - name: Boot ISO in disposable UEFI QEMU
        run: |
          ISO="deku-system/artifacts/deku-linux-technology-preview-x86_64.iso"
          SHA256="$(awk '{print $1}' "$ISO.sha256")"
          test -f "$OVMF_CODE"
          test -f "$OVMF_VARS"
          python3 deku-tests/tools/boot_smoke.py \
            --iso "$ISO" \
            --sha256 "$SHA256" \
            --firmware "$OVMF_CODE" \
            --firmware-vars "$OVMF_VARS" \
            --marker "DEKU_BOOT_OK:minimal-x86_64" \
            --timeout 420 \
            --evidence-dir deku-system/artifacts/boot-test
      - name: Generate unsigned in-toto build statement
        if: always()
        env:
          DEKU_SOURCE_SHA: ${{ github.sha }}
          DEKU_PROFILE_SHA: ${{ env.DEKU_PROFILE_SHA }}
          DEKU_VALIDATOR_SHA: ${{ env.DEKU_VALIDATOR_SHA }}
          DEKU_TEST_HARNESS_SHA: ${{ env.DEKU_TEST_HARNESS_SHA }}
          DEKU_WORKFLOW_RUN_ID: ${{ github.run_id }}
          DEKU_WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DEKU_BUILDER_IMAGE: fedora:44@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80
        run: |
          python3 deku-system/scripts/write-provenance.py \
            --iso deku-system/artifacts/deku-linux-technology-preview-x86_64.iso \
            --manifest deku-system/artifacts/build-manifest.txt \
            --boot-result deku-system/artifacts/boot-test/boot-result.json \
            --output deku-system/artifacts/provenance.intoto.jsonl
      - name: Normalize artifact permissions
        if: always()
        run: |
          if [ -d deku-system/artifacts ]; then
            sudo chown -R "$(id -u):$(id -g)" deku-system/artifacts
          fi
      - name: Upload ISO and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deku-linux-experimental-iso-${{ github.run_id }}
          path: |
            deku-system/artifacts/**
          if-no-files-found: warn
          retention-days: 7
