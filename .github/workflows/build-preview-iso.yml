name: Build experimental ISO

on:
  push:
    branches: [dev]
    paths:
      - "kickstart/**"
      - "scripts/build-preview-iso.sh"
      - ".github/workflows/build-preview-iso.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-preview:
    # No pull_request trigger and no secrets: the image builder needs elevated
    # mount privileges. This runs only on an ephemeral GitHub-hosted runner.
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out system repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: deku-system
      - name: Check out profile repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Deku-Foundation/deku-profiles
          ref: main
          path: deku-profiles
      - name: Build in disposable Fedora 44 container
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          docker run --rm --privileged --network=host \
            -e GITHUB_SHA -e GITHUB_RUN_ID \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace/deku-system \
            fedora:44 bash -euxo pipefail -c '
              dnf -y install lorax lorax-lmc-novirt
              ./scripts/build-preview-iso.sh
            '
      - name: Upload ISO and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deku-linux-experimental-iso-${{ github.run_id }}
          path: |
            deku-system/artifacts/*.iso
            deku-system/artifacts/*.sha256
            deku-system/artifacts/*.txt
            deku-system/artifacts/*.log
          if-no-files-found: warn
          retention-days: 3
