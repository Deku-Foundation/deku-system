name: Repository checks

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs-and-layout:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check required design documents and paused ISO policy
        shell: bash
        run: |
          set -euo pipefail
          test -s README.md
          test -s docs/build-pipeline.md
          test -s docs/architecture/first-iso-pipeline.md
          test ! -e .github/workflows/build-preview-iso.yml
          test ! -e scripts/build-preview-iso.sh
          test ! -e kickstart/deku-minimal-live.ks
          grep -qi "paused" docs/architecture/first-iso-pipeline.md
          grep -qi "infrastructure-first" README.md
          grep -q "not the project priority" README.md
          if grep -RInE '[[:blank:]]+          if grep -RInE '[[:blank:]]+$' --include='*.md' .; then
            echo 'Trailing whitespace found in Markdown files.' >&2
            exit 1
          fi
          echo 'Infrastructure-first policy and archived experiment status checks passed.'
 --include='*.md' .; then
            echo 'Trailing whitespace found in Markdown files.' >&2
            exit 1
          fi
          if grep -RInE '[[:blank:]]+$' --include='*.md' .; then
            echo 'Trailing whitespace found in Markdown files.' >&2
            exit 1
          fi
          echo 'Infrastructure-first policy and archived experiment status checks passed.'
