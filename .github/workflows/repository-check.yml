name: Repository checks

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs-and-layout:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check required design documents
        shell: bash
        run: |
          set -euo pipefail
          test -s README.md
          test -s docs/build-pipeline.md
          if grep -RInE '[[:blank:]]+$' --include='*.md' .; then
            echo 'Trailing whitespace found in Markdown files.' >&2
            exit 1
          fi
          echo 'Repository layout and Markdown whitespace checks passed.'
      - name: Check out pinned system profile
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Deku-Foundation/deku-profiles
          ref: 2924c0eabe745542f61985062ad164133e5e006f
          path: deku-profiles
          persist-credentials: false
      - name: Check out pinned Rust validator
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Deku-Foundation/deku-build
          ref: 8316f0b49a31412db019c6b06379f61e64da4640
          path: deku-build
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Validate profile and Kickstart contract in Rust
        working-directory: deku-build
        run: |
          cargo run -- validate-profile \
            "$GITHUB_WORKSPACE/deku-profiles/profiles/minimal-x86_64/profile.json" \
            "$GITHUB_WORKSPACE/kickstart/deku-minimal-live.ks"
